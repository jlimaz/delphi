<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Delphi Settings checks</title>
<style>
  body { background: #ececf0; color: #1d1d1f; font: 14px system-ui; margin: 24px; }
  iframe { width: 780px; height: 532px; border: 0; border-radius: 12px; background: #f4f4f7; box-shadow: 0 16px 48px #0002; }
  pre { white-space: pre-wrap; line-height: 1.6; } .pass { color: #168445; } .fail { color: #c22; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f5f5f7; } iframe { background: #29292c; } }
</style>
<h1>Delphi Settings checks</h1><p>Mock bridge: no settings files, microphone or app actions.</p>
<pre id="results">Running…</pre><iframe id="preview" title="Delphi Settings preview"></iframe>
<script type="module">
const frame = document.getElementById('preview'), results = document.getElementById('results'), messages = [], checks = [];
const assert = (condition, name) => { if (!condition) throw Error(name); checks.push('✓ ' + name); };
window.addEventListener('message', e => { if (e.source === frame.contentWindow) messages.push(e.data); });
try {
  const html = await (await fetch('../ui/settings.html')).text();
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.srcdoc = html.replace('<head>', `<head><script>window.webkit = {messageHandlers: {st: {postMessage: m => parent.postMessage(m, '*')}}};<\/script>`);
  await loaded;
  const w = frame.contentWindow, d = w.document;
  const base = {hotkeyLabel:'⌃⌥Space',model:'haiku',volume:.16};
  w.st.load({prefs:{...base,routing:'balanced'}});
  assert([...d.querySelectorAll('[data-k=routing] button')].map(b=>b.dataset.v).join()==='cheapest,balanced,capable','One intelligence setting offers three modes');
  assert(d.querySelector('[data-k=routing] [data-v=balanced]').getAttribute('aria-pressed')==='true','Balanced is selected accessibly');
  d.querySelector('[data-k=routing] [data-v=cheapest]').click();
  await new Promise(r=>setTimeout(r,20));
  assert(messages.some(m=>m.do==='set'&&m.k==='routing'&&m.v==='cheapest'),'The routing choice is saved');
  assert(d.querySelector('[data-k=model]').closest('.row').hidden,'Cheapest needs no work model choice');
  w.st.load({prefs:{...base,routing:'capable',model:'opus'}});
  assert(d.querySelector('[data-k=model] [data-v=opus]').getAttribute('aria-pressed')==='true','Most capable retains the chosen bigger model');
  w.st.load({prefs:{...base,routing:'balanced',apiBase:'https://fixture.invalid',apiModel:'main-model'}});
  w.st.models({base:'https://fixture.invalid',key:'',list:['main-model','other-model']});
  assert(d.querySelector('[data-k=routing]').closest('.row').hidden&&!d.getElementById('agentServerModel'),'Custom servers retain their own model and hide routing');
  w.st.load({prefs:{...base,routing:'balanced'}});
  w.st.local([{name:'Ollama',base:'http://localhost:11434',models:['qwen3']}]);
  assert(!d.getElementById('localserver').hidden&&d.getElementById('uselocal').textContent==='Use Ollama','A running local server is offered');
  d.getElementById('uselocal').click();await new Promise(r=>setTimeout(r,20));
  assert(messages.some(m=>m.do==='set'&&m.k==='apiBase'&&m.v==='http://localhost:11434')&&messages.some(m=>m.do==='set'&&m.k==='apiModel'&&m.v==='qwen3'),'Local offer fills the address and first server model');
  w.st.load({prefs:{...base,routing:'balanced',client:'devin'}});
  assert(d.querySelector('[data-k=routing]').closest('.row').hidden,'Other clients hide Claude routing');
  w.st.load({prefs:{...base,routing:'balanced',client:'pi'}});
  assert(d.querySelector('[data-k=routing]').closest('.row').hidden,'Pi hides Claude routing');
  w.st.load({prefs:{...base,routing:'balanced',client:'claude'}});
  assert(!d.getElementById('screen')&&!d.getElementById('sound')&&d.getElementById('account').querySelector('[data-k=screen]')&&d.getElementById('account').querySelector('[data-k=hideWhenSharing]'),'Screen privacy lives in Account & Access; no Screen or Sound pages');

  const prefs = {hotkeyLabel: '⌃⌥Space', input: 'voice', talkMode: 'hold', volume: .16, model: 'haiku', login: true, menuIcon: true, safe: true, soundDone: 'Glass'};
  const load = p => w.st.load({prefs: {...prefs, ...p}});
  load({});
  assert([...d.querySelectorAll('.sw input,select[data-k],input[type=range],.seg[data-k]')].every(e=>e.hasAttribute('aria-label')||e.hasAttribute('aria-labelledby')),'Every Settings control has an accessible name');
  w.st.mics([{uid:'built-in-fixture',name:'MacBook Microphone'},{uid:'usb-fixture',name:'Studio Mic'}]);
  const microphone=d.querySelector('[data-k="microphone"]');
  assert(microphone.value==='automatic'&&microphone.options[0].text==='Automatic (recommended)'&&microphone.options.length===3,'Microphone picker starts recommended and lists devices');
  microphone.value='usb-fixture';microphone.dispatchEvent(new w.Event('change'));await new Promise(r=>setTimeout(r,20));
  assert(messages.some(m=>m.do==='set'&&m.k==='microphone'&&m.v==='usb-fixture'),'Microphone choice persists by UID');
  load({microphone:'unplugged-fixture'});w.st.mics([{uid:'built-in-fixture',name:'MacBook Microphone'}]);
  assert(microphone.value==='automatic','An unplugged microphone visibly falls back to Automatic');
  const speak=d.querySelector('[data-k="speak"]');assert(!speak.checked,'Answers are not read aloud by default');
  speak.click();await new Promise(r=>setTimeout(r,20));assert(messages.some(m=>m.do==='set'&&m.k==='speak'&&m.v===true),'Read answers aloud persists');
  w.st.tab('general');
  const mode = d.querySelector('[data-k="talkMode"]'), hold = mode.querySelector('[data-v="hold"]'), toggle = mode.querySelector('[data-v="toggle"]');
  assert(hold.getAttribute('aria-pressed') === 'true', 'Hold remains the default');
  toggle.click(); await new Promise(resolve => setTimeout(resolve, 20));
  assert(messages.some(m => m.do === 'set' && m.k === 'talkMode' && m.v === 'toggle'), 'Toggle choice persists through the native bridge');
  assert(toggle.getAttribute('aria-pressed') === 'true' && hold.getAttribute('aria-pressed') === 'false', 'Selected mode is accessible');
  assert(d.getElementById('schint').textContent.includes('again to send'), 'Shortcut hint follows toggle mode');
  assert(d.getElementById('talkhint').textContent.includes('Pauses keep listening'), 'Toggle explains what a pause does');
  toggle.focus(); assert(d.activeElement === toggle, 'Mode buttons can receive keyboard focus');
  assert(d.documentElement.scrollWidth <= 780 && mode.scrollWidth <= mode.clientWidth, 'Controls fit the native Settings width');
  const row = mode.closest('.row'); assert(row.scrollWidth <= row.clientWidth, 'Mode row does not overflow');
  frame.style.width = '700px'; await new Promise(resolve => requestAnimationFrame(resolve));
  assert(d.documentElement.scrollWidth <= 700 && row.scrollWidth <= row.clientWidth, 'Controls fit a narrower window');
  frame.style.width = '780px';
  load({input: 'type', talkMode: 'toggle'});
  assert(mode.closest('.row').hidden && !d.querySelector('[data-k=input]').closest('.row').hidden && d.getElementById('schint').textContent.includes('Return sends'), 'Typing mode shows its own shortcut interaction');
  load({talkMode: 'toggle'});
  const change = d.getElementById('change');
  change.click(); assert(change.textContent === 'Cancel Recording', 'Recording has a visible cancel action');
  change.click(); await new Promise(resolve => setTimeout(resolve, 20));
  assert(messages.some(m => m.do === 'cancelRecord') && d.getElementById('caps').textContent.includes('Space'), 'Cancel restores the original shortcut');
  change.click(); d.querySelector('nav button[data-s="brain"]').click();
  assert(!d.getElementById('shortcut').classList.contains('rec'), 'Switching tabs cancels recording');
  d.querySelector('nav button[data-s="general"]').click(); change.click();
  d.getElementById('talklabel').dispatchEvent(new w.Event('pointerdown', {bubbles: true}));
  assert(change.textContent === 'Change Shortcut' && d.getElementById('caps').textContent.includes('Space'), 'Clicking away cancels without replacing the shortcut');
  w.st.load({prefs, state: {rules: [], skills: [], plan: {ok: true, text: 'Pro'}}});
  assert(!d.getElementById('usage')&&!d.getElementById('meetings')&&!d.querySelector('nav [data-s="usage"],nav [data-s="meetings"]'),'No Usage or Meetings pages');
  assert(d.getElementById('memory').querySelector('[data-do="clearRecent"]'),'Forget this conversation lives in Memory');
  const profileState={rules:[],skills:[],plan:{ok:true,text:'Pro'},me:{version:2,facts:[
    {id:'name1',category:'basics',kind:'name',value:'Sam Example',source:'you',date:'2026-10-13'},
    {id:'email1',category:'contact',kind:'home email',value:'sam@example.test',source:'contacts',date:'2026-10-13'}]}};
  w.st.state(profileState);w.st.tab('memory');
  const basics=d.querySelector('[data-category="basics"]'),contact=d.querySelector('[data-category="contact"]');
  assert(basics.querySelector('summary span').textContent==='1'&&!basics.open,'Profile categories start compact with counts');
  contact.open=true;await new Promise(r=>setTimeout(r,20));assert(contact.querySelector('.source-pill').textContent==='contacts · 2026-10-13','Expanded facts show source and date');
  const email=contact.querySelector('[data-profile-id]');email.value='home email: new@example.test';email.dispatchEvent(new w.Event('change'));await new Promise(r=>setTimeout(r,20));
  assert(messages.some(m=>m.do==='me'&&m.action==='set'&&m.id==='email1'&&m.text.includes('new@example.test')),'Profile facts edit inline');
  const dropped=()=>messages.some(m=>m.do==='me'&&m.action==='drop'&&m.id==='email1');
  contact.querySelector('[data-profile-drop]').click();await new Promise(r=>setTimeout(r,20));assert(!dropped(),'Profile deletes wait out Undo');
  w.st.notice({text:''});await new Promise(r=>setTimeout(r,20));assert(dropped(),'Profile facts delete inline');
  const add=contact.querySelector('[data-profile-add]');add.value='phone: +1 555 0100';add.nextElementSibling.click();await new Promise(r=>setTimeout(r,20));
  assert(messages.some(m=>m.do==='me'&&m.action==='add'&&m.category==='contact'),'Expanded categories add facts');
  w.st.state({...profileState,rules:['Use Chrome for browsing'],me:{version:2,facts:[...profileState.me.facts,{id:'dad1',category:'people',kind:'dad email',value:'pat@example.test',source:'learned',date:'2026-10-13'}]}});
  const rule=d.querySelector('[data-rule]');rule.value='Use Chrome for all browsing';rule.dispatchEvent(new w.Event('change'));await new Promise(r=>setTimeout(r,20));
  assert(messages.some(m=>m.do==='rule'&&m.old==='Use Chrome for browsing'&&m.text==='Use Chrome for all browsing'),'Rules edit inline like profile facts');
  rule.value='';rule.dispatchEvent(new w.Event('change'));await new Promise(r=>setTimeout(r,20));assert(messages.some(m=>m.do==='forget'&&m.line==='Use Chrome for browsing'),'An emptied rule is forgotten');
  w.st.reveal({c:'people',t:'dad email: pat@example.test'});
  const people=d.querySelector('[data-category="people"]'),glow=d.querySelector('.flash');
  assert(people.open&&glow&&glow.querySelector('input').value==='dad email: pat@example.test','A receipt opens Memory on its category and highlights the item');
  w.st.reveal({c:'rules',t:'Something already forgotten'});assert(d.getElementById('rules').classList.contains('flash'),'A forgotten item shows its category');
  assert(d.getElementById('profileImport').textContent==='Refresh','Imported facts turn Import into Refresh');
  d.getElementById('profileImport').click();await new Promise(r=>setTimeout(r,20));assert(messages.some(m=>m.do==='profileImport')&&d.getElementById('profileImport').disabled,'Mac import begins only from its button');
  w.st.profileImport({counts:{contacts:1,mail:2},errors:[]});assert(!d.getElementById('profileImport').disabled&&d.getElementById('profileStatus').textContent.includes('2 from Mail'),'Import reports per-source counts');
  d.querySelector('[data-profile-source="contacts"]').click();await new Promise(r=>setTimeout(r,20));assert(messages.some(m=>m.do==='me'&&m.action==='forget-source'&&m.source==='contacts'),'A source can be forgotten at once');
  // Permissions: live status, including the rows normal asks need for pages, scripting and the calendar
  w.st.tab('account');w.st.perms({mic:true,speech:true,ax:true,screen:true,auto:true,chrome:false,calendar:false});
  assert(d.querySelector('#perms [data-g="calendar"]').hidden===false&&d.querySelector('#perms [data-g="auto"]').hidden===true,'Permission rows show Allowed or Allow, live');
  assert(!d.getElementById('agentsetup')&&!d.getElementById('enableAll')&&!d.getElementById('agentsnav'),'No agent setup, Enable All or Agents button');
  w.st.tab('apps');assert(d.getElementById('apps').classList.contains('on')&&d.querySelector('nav button[data-s="account"]').classList.contains('on'),'Apps opens from Account & Access without its own sidebar page');
  results.textContent = checks.join('\n') + `\n\n${checks.length} checks passed.`; results.className = 'pass';
} catch (error) { results.textContent = checks.join('\n') + '\n✗ ' + error.message; results.className = 'fail'; }
</script></html>
